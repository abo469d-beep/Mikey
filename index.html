<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة تصنيفات اللاعبين</title>
    <style>
        body { background-color: #0d0f18; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #f39c12; }
        .player-card { background: #161b22; margin: 10px auto; padding: 15px; width: 90%; max-width: 500px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; }
        .tag { background: #238636; padding: 5px 10px; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>مستويات وتصنيفات اللاعبين</h1>
    
    <div class="player-card">
        <div>
            <h3>iRuby_X</h3>
            <p>نقاط: 60 | متخصص قتالي</p>
        </div>
        <div class="tag">جافا (Java)</div>
    </div>

    <div class="player-card">
        <div>
            <h3>Mustfa_105</h3>
            <p>نقاط: 42 | طالب عسكري</p>
        </div>
        <div class="tag" style="background: #da3633;">كراك (Cracked)</div>
    </div>

</body>
</html>
